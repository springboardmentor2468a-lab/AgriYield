<!DOCTYPE html>
<html>
<head>
    <title>AgriSense AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #d4f4dd 0%, #a8e6cf 50%, #b2f2bb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            padding: 35px;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 500;
            color: #64748b;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
            transform: translateY(-1px);
        }
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            padding-left: 60px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .quick-fill {
            text-align: center;
            margin-bottom: 25px;
        }
        .quick-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .quick-btn:hover { transform: scale(1.05); }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 0;
        }
        .input-group.full {
            grid-column: 1 / -1;
        }
        label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        input, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafbff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
            background: white;
        }
        input[readonly] {
            background: #f0f9f4;
            color: #2e7d32;
            font-weight: 500;
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-yield {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }
        .btn-yield:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(76,175,80,0.4);
        }
        .btn-crop {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
        }
        .btn-crop:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(33,150,243,0.4);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .result-yield { background: #e8f5e8; color: #2e7d32; border: 2px solid #c8e6c9; }
        .result-crop { background: #e3f2fd; color: #1565c0; border: 2px solid #bbdefb; }
        @media (max-width: 700px) {
            .inputs-grid { grid-template-columns: 1fr; }
            .buttons { grid-template-columns: 1fr; }
            .container { padding: 25px 20px; }
            h1 { padding-left: 0; font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Welcome</a>
        
        <h1>🌱 AgriSense AI Dashboard</h1>
        <p class="subtitle">Enter soil & climate data for smart predictions</p>

        <div class="quick-fill">
            <button class="quick-btn" type="button" onclick="fillSampleData()">⚡ Quick Fill Sample</button>
        </div>

        <form method="POST" id="mainForm">
            <div class="inputs-grid">
                <div class="input-group">
                    <label>🌿 Nitrogen (N) kg/ha</label>
                    <input type="number" name="nitrogen" step="0.1" id="nitrogen" required>
                </div>
                
                <div class="input-group">
                    <label>💧 Phosphorus (P) kg/ha</label>
                    <input type="number" name="phosphorus" step="0.1" id="phosphorus" required>
                </div>
                
                <div class="input-group">
                    <label>⚡ Potassium (K) kg/ha</label>
                    <input type="number" name="potassium" step="0.1" id="potassium" required>
                </div>
                
                <div class="input-group">
                    <label>🌡️ Temperature (°C)</label>
                    <input type="number" name="temperature" step="0.1" id="temperature" required>
                </div>
                
                <div class="input-group">
                    <label>💨 Humidity (%)</label>
                    <input type="number" name="humidity" step="0.1" id="humidity" required>
                </div>
                
                <div class="input-group">
                    <label>🌧️ Rainfall (mm)</label>
                    <input type="number" name="rainfall" step="0.1" id="rainfall" required>
                </div>
            </div>
            
            <div class="input-group full">
                <label>🧪 pH Level</label>
                <input type="number" name="ph" step="0.1" id="ph" required>
            </div>
            
            <div class="input-group full">
                <label>🌾 Select Crop (Only for Yield prediction)</label>
                <select name="crop" id="crop" required>
                    <option disabled selected>Choose a crop...</option>
                    {% for crop in crops %}
                        <option value="{{ crop }}">{{ crop.title() }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="buttons">
                <button class="btn btn-yield" formaction="/predict_yield" type="submit">
                    📈 Predict Yield
                </button>
                <button class="btn btn-crop" formaction="/crop_recommendation" type="submit">
                    🌟 Recommend Crop
                </button>
            </div>
        </form>

        {% if yield_result %}
            <div class="result result-yield">
                🌾 Predicted Yield: <strong>{{ yield_result }}</strong>
            </div>
        {% endif %}

        {% if crop_result %}
            <div class="result result-crop">
                ✅ Recommended: <strong>{{ crop_result }}</strong>
            </div>
        {% endif %}
    </div>

    <script>
        function fillSampleData() {
            document.getElementById('nitrogen').value = '90';
            document.getElementById('phosphorus').value = '42';
            document.getElementById('potassium').value = '43';
            document.getElementById('temperature').value = '20.9';
            document.getElementById('humidity').value = '82.0';
            document.getElementById('rainfall').value = '6.5';
            document.getElementById('ph').value = '6.5';
            document.getElementById('crop').value = 'mango';
        }
    </script>
</body>
</html>
