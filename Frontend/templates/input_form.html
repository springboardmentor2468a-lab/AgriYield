<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPredictor - Crop Yield Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inputform.css') }}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card">
                <h1>Crop Yield Prediction</h1>
                <p class="instruction">Please provide valid inputs to predict the yield</p>

                {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('predict') }}">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Nitrogen (N) (kg/ha)</label>
                            <input type="number" class="form-control" name="N" step="0.01" required placeholder="e.g., 50">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Phosphorus (P) (kg/ha)</label>
                            <input type="number" class="form-control" name="P" step="0.01" required placeholder="e.g., 30">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Potassium (K) (kg/ha)</label>
                            <input type="number" class="form-control" name="K" step="0.01" required placeholder="e.g., 40">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Temperature (°C)</label>
                            <input type="number" class="form-control" name="temperature" step="0.01" required placeholder="e.g., 25">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Humidity (%)</label>
                            <input type="number" class="form-control" name="humidity" step="0.01" required placeholder="e.g., 80">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Soil pH</label>
                            <input type="number" class="form-control" name="ph" step="0.01" required placeholder="e.g., 6.5">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Rainfall (mm)</label>
                            <input type="number" class="form-control" name="rainfall" step="0.01" required placeholder="e.g., 100">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Select Crop</label>
                            <select class="form-select" name="Crop" required>
                                <option value="" disabled selected>Select Crop</option>
                                {% for crop in crops %}
                                    <option value="{{ crop }}">{{ crop.capitalize() }}</option>
                                {% endfor %}
                            </select>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-4">Predict Yield</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
