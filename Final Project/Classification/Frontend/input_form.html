<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Recommendation Input</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form_result.css') }}">

</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">🌾 Crop Recommendation Input</h2>

        <form action="/predict" method="POST">
            <div class="row g-3">

                <div class="col-md-4">
                    <label>Nitrogen (N)</label>
                    <input type="number" name="N" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Phosphorus (P)</label>
                    <input type="number" name="P" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Potassium (K)</label>
                    <input type="number" name="K" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Temperature (°C)</label>
                    <input type="number" step="any" name="temperature" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Humidity (%)</label>
                    <input type="number" step="any" name="humidity" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Soil pH</label>
                    <input type="number" step="any" name="ph" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label>Rainfall (mm)</label>
                    <input type="number" step="any" name="rainfall" class="form-control" required>
                </div>

            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4">
                    Get Recommendation
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
