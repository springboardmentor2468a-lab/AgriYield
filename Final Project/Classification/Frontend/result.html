<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Recommendation Result</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">

</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-5 text-center">

        <h2 class="mb-3">🌾 Crop Recommendation Result</h2>

        <p class="fs-5">
            Based on the soil nutrients and climatic conditions you provided,
            the most suitable crop to grow is:
        </p>

        <div class="alert alert-success mt-4 fs-4 fw-bold">
            {{ crop }}
        </div>

        <div class="mt-4">
            <a href="/input" class="btn btn-outline-success me-2">
                🔁 Try Another Input
            </a>
            <a href="/" class="btn btn-success">
                🏠 Back to Home
            </a>
        </div>

    </div>
</div>

</body>
</html>
