<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Recommendation System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            background: #fff;
            width: 90%;
            max-width: 900px;
            padding: 35px 40px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px 25px;
        }

        .form-group label {
            font-size: 13px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #27ae60;
            box-shadow: 0 0 0 2px rgba(39,174,96,0.2);
        }

        .actions {
            grid-column: span 2;
            margin-top: 25px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #27ae60;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #219150;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #a9dfbf;
        }

        .error {
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5b7b1;
        }

        footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #aaa;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .actions {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🌱 Crop Recommendation</h1>
    <p>Enter soil and climate details to get the best crop</p>

    <div class="form-grid">

        <div class="form-group">
            <label>Nitrogen (N)</label>
            <input id="n" type="number" placeholder="e.g. 90">
        </div>

        <div class="form-group">
            <label>Phosphorus (P)</label>
            <input id="p" type="number" placeholder="e.g. 30">
        </div>

        <div class="form-group">
            <label>Potassium (K)</label>
            <input id="k" type="number" placeholder="e.g. 40">
        </div>

        <div class="form-group">
            <label>Temperature (°C)</label>
            <input id="temperature" type="number" placeholder="e.g. 25">
        </div>

        <div class="form-group">
            <label>Humidity (%)</label>
            <input id="humidity" type="number" placeholder="e.g. 80">
        </div>

        <div class="form-group">
            <label>pH Value</label>
            <input id="ph" type="number" step="0.1" placeholder="e.g. 6.5">
        </div>

        <div class="form-group">
            <label>Rainfall (mm)</label>
            <input id="rainfall" type="number" placeholder="e.g. 200">
        </div>

        <div class="actions">
            <button onclick="predict()">Predict Crop</button>
            <div id="result" class="result"></div>
        </div>

    </div>

    <footer>Powered by Machine Learning</footer>
</div>

<script>
function predict() {
    const ids = ["n","p","k","temperature","humidity","ph","rainfall"];
    for (let id of ids) {
        if (!document.getElementById(id).value) {
            showResult("Please fill all fields", false);
            return;
        }
    }

    fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            n: Number(n.value),
            p: Number(p.value),
            k: Number(k.value),
            temperature: Number(temperature.value),
            humidity: Number(humidity.value),
            ph: Number(ph.value),
            rainfall: Number(rainfall.value)
        })
    })
    .then(res => res.json())
    .then(data => {
        showResult("🌾 Recommended Crop: " + data.label, true);
    })
    .catch(() => {
        showResult("⚠️ Server not reachable", false);
    });
}

function showResult(message, success) {
    const result = document.getElementById("result");
    result.style.display = "block";
    result.className = "result " + (success ? "success" : "error");
    result.innerText = message;
}
</script>

</body>
</html>
