<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FarmSense AI – Welcome</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-image: url("/static/images/farm-bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e9f5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(0, 0, 0, 0.35), transparent 60%),
                  linear-gradient(135deg, rgba(3, 17, 30, 0.9), rgba(2, 30, 18, 0.9));
      z-index: 0;
    }

    .landing-card {
      position: relative;
      z-index: 1;
      max-width: 820px;
      width: 100%;
      padding: 32px 28px;
      border-radius: 28px;
      background: rgba(5, 18, 32, 0.92);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(170, 210, 255, 0.3);
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
      align-items: center;
      text-align: center;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(19, 47, 76, 0.95);
      border: 1px solid rgba(129, 199, 132, 0.7);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .logo-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #a5ffcc, #00c853);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
    }

    .title {
      margin: 4px 0 0;
      font-size: 34px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tagline {
      margin: 2px 0 0;
      font-size: 17px;
      font-weight: 500;
      color: #a5ffcc;
    }

    .description {
      margin-top: 10px;
      font-size: 14px;
      max-width: 580px;
      opacity: 0.9;
    }

    .cta-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 18px;
    }

    .primary-btn {
      padding: 10px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ffca28, #ff8f00);
      color: #041017;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
      text-decoration: none;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 22px 46px rgba(0, 0, 0, 0.85);
    }

    @media (max-width: 720px) {
      .landing-card {
        padding: 24px 20px;
      }

      .title {
        font-size: 28px;
      }

      .tagline {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <main class="landing-card">
    <div class="logo-badge">
      <div class="logo-circle">🌾</div>
      <span>FarmSense AI</span>
    </div>

    <h1 class="title">FARMSENSE AI</h1>
    <p class="tagline">Smart Agricultural Solutions</p>

    <p class="description">
      Predict crop yields, optimize resources, and make data-driven farming decisions.
    </p>

    <div class="cta-row">
      <a href="/predictor" class="primary-btn">
        Get started
      </a>
    </div>
  </main>
</body>
</html>
